# Releases MMP: push a tag matching apps/server/package.json, e.g. v5.0.0 or v5.0.0-beta.1.
# Publishes crazything1/mmp to Docker Hub, then creates the GitHub release that panels read
# to show "update available".
#
# Needs repo secrets DOCKERHUB_USERNAME (crazything1) and DOCKERHUB_TOKEN (a Docker Hub
# access token with Read & Write).
name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the server version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./apps/server/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match apps/server/package.json ($pkg)" >&2
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          case "$pkg" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: crazything1/mmp
          # Pre-releases (5.0.0-alpha.1) only get their exact tag; latest/5/5.0 move on full releases.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=MMP
            org.opencontainers.image.description=Modpack Management Panel: modpack server, admin panel and file hosting

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags="$flags --prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "MMP ${{ steps.version.outputs.version }}" $flags
